name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap add android || true
          npx cap sync android

      - name: Align legacy Kotlin standard library dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          // Kotlin 1.8+ includes the former jdk7/jdk8 stdlib classes.
          // Exclude the obsolete split artifacts pulled by older Android libraries.
          subprojects {
              configurations.configureEach {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Grant Execute Permission to Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFMaster-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
