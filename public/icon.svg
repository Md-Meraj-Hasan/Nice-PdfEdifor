<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  
  <!-- Document Shape -->
  <g filter="url(#shadow)">
    <path d="M128 80 C128 66.7 138.7 56 152 56 H296 L384 144 V424 C384 437.3 373.3 448 360 448 H152 C138.7 448 128 437.3 128 424 Z" fill="url(#grad1)" />
    <!-- Fold Corner -->
    <path d="M296 56 V136 C296 140.4 299.6 144 304 144 H384 Z" fill="url(#foldGrad)" opacity="0.9" />
  </g>

  <!-- PDF Badge -->
  <rect x="160" y="220" width="100" height="42" rx="8" fill="#ef4444" />
  <text x="210" y="250" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">PDF</text>

  <!-- Tool Icons (Wrench/Crop/Pen/Scissors) -->
  <!-- Scissors overlay in white/amber -->
  <circle cx="210" cy="330" r="18" fill="none" stroke="#f8fafc" stroke-width="8" />
  <circle cx="210" cy="378" r="18" fill="none" stroke="#f8fafc" stroke-width="8" />
  <path d="M224 336 L320 376 M224 372 L320 332" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <circle cx="266" cy="354" r="6" fill="#38bdf8" />

  <!-- Pen tip -->
  <path d="M330 200 L350 220 L300 270 L280 270 L280 250 Z" fill="#fbbf24" />
</svg>
